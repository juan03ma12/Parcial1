	<title>Overwatch - Héroes</title>

	<link rel="stylesheet" href="assets/css/main.css" />

<body>
	<header id="header">
		<h1>AGENTES DE OVERWATCH</h1>
		<nav>
			<ul>
				<li><a href="index.html">Inicio</a></li>
				<li><a href="heroes.html">Héroes</a></li>
				<li><a href="mapas.html">Mapas</a></li>
				<li><a href="multimedia.html">Multimedia</a></li>
				<li><a href="contacto.html">Unirse</a></li>
			</ul>
		</nav>
	</header>

	<main class="content">
		<h2>Filtro de Roles</h2>
		<div class="filter-bar">
			<button class="filter-btn" data-role="all">Todos</button>
			<button class="filter-btn" data-role="tank">Tanque</button>
			<button class="filter-btn" data-role="dps">Daño</button>
			<button class="filter-btn" data-role="support">Apoyo</button>
		</div>

		<div class="hero-grid">
			<div class="hero-card card" data-role="dps">
				<h3>Tracer</h3>
				<img src="assets/images/tracer.png" alt="Tracer" style="width:100%; max-width:250px;">
				<p>Rol: Daño | Habilidad: Salto Temporal</p>
			</div>
			<div class="hero-card card" data-role="tank">
				<h3>Reinhardt</h3>
				<img src="assets/images/reinhardt.png" alt="Reinhardt" style="width:100%; max-width:250px;">
				<p>Rol: Tanque | Habilidad: Campo de Fuerza</p>
			</div>
			<div class="hero-card card" data-role="support">
				<h3>Mercy</h3>
				<img src="assets/images/mercy.png" alt="Mercy" style="width:100%; max-width:250px;">
				<p>Rol: Apoyo | Habilidad: Resurrección</p>
			</div>
		</div>
	</main>

	<footer>
		<p>&copy; Overwatch Fan Site. Creado con plantilla de <a href="https://html5up.net" target="_blank">HTML5 UP</a>.</p>
