<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overwatch Fan Portal</title>
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

    <!-- Encabezado Principal / Hero Banner -->
    <header class="hero-banner">
        <div class="banner-content">
            <h1>Overwatch Fan Portal</h1>
            <p>Explora héroes, multimedias y la jugabilidad del universo de Overwatch</p>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="main-container">

        <!-- Sección 1: Galería de Héroes e Imágenes -->
        <section class="heroes-section">
            <h2>Héroes Destacados</h2>
            <div class="hero-grid">

                <article class="hero-card">
                    <!-- RUTA DE IMAGEN CORREGIDA -->
                    <img src="assets/images/dva.jpg" alt="D.Va - Overwatch">
                    <h3>D.Va</h3>
                    <p>Rol: Tanque</p>
                    
        
                </article>

                <article class="hero-card">
                    <!-- RUTA DE IMAGEN CORREGIDA -->
                    <img src="assets/images/mercy.png" alt="Mercy - Overwatch">
                    <h3>Mercy</h3>
                    <p>Rol: Apoyo</p>


                    </div>
                </article>

            </div>
        </section>

        <!-- Sección 2: Galería de Videos -->
        <section class="videos-section">
            <h2>Galería de Video</h2>

            <!-- Opción A: Video Incrustado desde YouTube -->
            <div class="video-block">
                <h3>Cinemática Oficial (YouTube)</h3>
                <div class="video-container">
                    <iframe 
                        src="https://www.youtube.com/watch?v=FqnKB22pOC0" 
                        title="Overwatch Cinematic Trailer" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

        </section>

    </main>

    <!-- Pie de Página -->
    <footer>
        <p>&copy; 2026 Overwatch Fan Page. Los assets pertenecen a Blizzard Entertainment.</p>
    </footer>

</body>
</html>
