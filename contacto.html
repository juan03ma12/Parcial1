<!DOCTYPE HTML>
<html lang="es">
<head>
	<title>Overwatch - Unirse a la Iniciativa</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
	<header id="header">
		<h1>FORMULARIO DE RECLUTAMIENTO</h1>
		<nav>
			<ul>
				<li><a href="index.html">Inicio</a></li>
				<li><a href="heroes.html">Héroes</a></li>
				<li><a href="mapas.html">Mapas</a></li>
				<li><a href="multimedia.html">Multimedia</a></li>
				<li><a href="contacto.html">Unirse</a></li>
			</ul>
		</nav>
	</header>

	<main class="content">
		<h2>Solicitud de Ingreso</h2>
		<form action="#" method="post" style="max-width:500px; margin: 0 auto; text-align:left;">
			<label for="name">Nombre / Alias:</label><br>
			<input type="text" id="name" name="name" required style="width:100%; padding:8px; margin-bottom:15px;"><br>

			<label for="email">Correo Electrónico:</label><br>
			<input type="email" id="email" name="email" required style="width:100%; padding:8px; margin-bottom:15px;"><br>

			<label for="role">Rol Preferido:</label><br>
			<select id="role" name="role" style="width:100%; padding:8px; margin-bottom:15px;">
				<option value="tank">Tanque</option>
				<option value="dps">Daño</option>
				<option value="support">Apoyo</option>
			</select><br>

			<label for="message">Especialidad / Mensaje:</label><br>
			<textarea id="message" name="message" rows="4" style="width:100%; padding:8px; margin-bottom:15px;"></textarea><br>

			<button type="submit" style="background:#f99e1a; color:white; border:none; padding:10px 20px; font-size:16px; cursor:pointer; border-radius:4px;">Enviar Solicitud</button>
		</form>
	</main>

	<footer>
		<p>&copy; Overwatch Fan Site. Creado con plantilla de <a href="https://html5up.net" target="_blank">HTML5 UP</a>.</p>
	</footer>
</body>
</html>
